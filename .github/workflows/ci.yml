name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Qt için sistem kitaplıkları
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q

  build-windows:
    name: Windows .exe
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      - name: PyInstaller ile tek dosya derle
        run: >
          pyinstaller --noconfirm --onefile --windowed
          --name QRMenuCagriEkrani
          --icon packaging/app.ico
          --paths src
          packaging/entry.py
      - name: Derlenen uygulama açılıyor mu?
        shell: pwsh
        run: |
          $p = Start-Process dist/QRMenuCagriEkrani.exe -PassThru -ArgumentList "-platform","offscreen"
          Start-Sleep -Seconds 8
          if ($p.HasExited) { Write-Error "Uygulama hemen kapandı (çıkış kodu $($p.ExitCode))"; exit 1 }
          Stop-Process -Id $p.Id
      - uses: actions/upload-artifact@v7
        with:
          name: QRMenuCagriEkrani-windows
          path: dist/QRMenuCagriEkrani.exe

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: QRMenuCagriEkrani-windows
      - uses: softprops/action-gh-release@v3
        with:
          files: QRMenuCagriEkrani.exe
          generate_release_notes: true
