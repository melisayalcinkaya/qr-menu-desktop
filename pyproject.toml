[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qr-menu-desktop"
dynamic = ["version"]
description = "QR Menü için kasa/mutfak çağrı ekranı: canlı garson çağrıları, menü ve masa yönetimi"
readme = "README.md"
license = "MIT"
authors = [{ name = "Melisa Yalçınkaya" }]
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.8,<7",
    "httpx>=0.27,<1",
    "keyring>=25",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "respx>=0.21", "ruff>=0.6", "pyinstaller>=6.10"]

[project.gui-scripts]
qr-menu-desktop = "qrmenu_desktop.app:main"

[tool.setuptools.dynamic]
version = { attr = "qrmenu_desktop.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "BLE"]
ignore = ["S101", "N802", "E501"]  # satır uzunluğunu ruff format yönetir; uzun Türkçe metinler bölünmez

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "BLE"]
